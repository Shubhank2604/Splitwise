services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: splitwise
      MYSQL_USER: splitwise
      MYSQL_PASSWORD: splitwise-local
      MYSQL_ROOT_PASSWORD: root-local-only
    ports:
      - "3306:3306"
    volumes:
      - splitwise-mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  splitwise-mysql:
