spring:
  datasource:
    url: jdbc:h2:mem:splitwise;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

security:
  jwt:
    secret: test-secret-that-is-at-least-thirty-two-bytes
    expiration-ms: 3600000
