spring:
  application:
    name: splitwise-api
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/splitwise}
    username: ${DB_USERNAME:splitwise}
    password: ${DB_PASSWORD:splitwise-local}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true

security:
  jwt:
    secret: ${JWT_SECRET:local-development-secret-change-me-now}
    expiration-ms: ${JWT_EXPIRATION:3600000}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
